# Статика одностраничного приложения: любой путь без файла (/history/123) отдаёт index.html,
# дальше страницу выбирает React Router
server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Имена файлов сборки содержат хеш содержимого — их можно кэшировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html — всегда свежий, иначе браузер не узнает о новой сборке
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
